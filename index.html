<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дом — движок</title>
<style>
  html,body{margin:0;height:100%;background:#cfdbe6;font:14px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;color:#1b2225}
  #app{position:fixed;inset:0}
  #panel{position:fixed;left:12px;right:12px;bottom:12px;max-width:760px;margin:auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;
    padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.18)}
  #panel b{font-weight:600}
  #hour{flex:1;min-width:160px}
  #stats{flex-basis:100%;font-size:12px;color:#4b585d}
</style>
</head>
<body>
<div id="app"></div>
<div id="panel">
  <b>Время</b><input id="hour" type="range" min="0" max="24" step="0.0833"><span id="hourOut"></span>
  <div id="stats"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
<script src="js/sun.js"></script>
<script src="js/micro.js"></script>
<script src="js/merge.js"></script>
<script src="js/house.js"></script>
<script src="js/demo.js"></script>
</body>
</html>
